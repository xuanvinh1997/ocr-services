[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpd-vi-en-ocr"
version = "2.0.0"
description = "Vietnamese-English document OCR service with PaddleOCR-VL and vLLM"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pymupdf>=1.24,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
paddle = ["paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4"]
training = ["transformers>=4.50,<6", "peft>=0.15,<1", "torch>=2.4"]
test = ["pytest>=8.0,<9"]

[project.scripts]
ocr-api = "ocr_service.api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ocr_service*", "training*"]
